name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Install native backend targets
        run: rustup target add x86_64-pc-windows-msvc x86_64-apple-darwin

      - name: Check formatting
        run: cargo fmt --check

      - name: Check device Rust formatting
        run: rustfmt --edition 2024 --check crates/neura-kernel/device/*.rs crates/neura-shader/device/*.rs

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint with every feature
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check Windows compute backend
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: Check macOS compute backend
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin

      - name: Test
        run: cargo test --workspace

      - name: Test the released device program
        run: cargo test --workspace --release
