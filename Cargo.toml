[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
description = "GPU-driven deep learning framework for games"
license = "MIT"
repository = "https://github.com/formetaohy/Neura"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
half = "2"
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
flate2 = "1"
bitflags = "2"
ash = "0.38"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
windows = "0.62"
libloading = "0.8"
neura-abi = { version = "0.6.0", path = "crates/neura-abi" }
neura-compiler = { version = "0.6.0", path = "crates/neura-compiler" }
neura-ast = { version = "0.6.0", path = "crates/neura-ast" }
neura-macro = { version = "0.6.0", path = "crates/neura-macro" }
neura-pointwise = { version = "0.6.0", path = "crates/neura-pointwise" }
neura-profile = { version = "0.6.0", path = "crates/neura-profile" }
neura-precision = { version = "0.6.0", path = "crates/neura-precision" }
neura-graph = { version = "0.6.0", path = "crates/neura-graph" }
neura-shader = { version = "0.6.0", path = "crates/neura-shader" }
neura-kernel = { version = "0.6.0", path = "crates/neura-kernel" }
neura-gpu = { version = "0.6.0", path = "crates/neura-gpu" }
neura-plan = { version = "0.6.0", path = "crates/neura-plan" }
neura-runtime = { version = "0.6.0", path = "crates/neura-runtime" }
neura-nn = { version = "0.6.0", path = "crates/neura-nn" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "neura"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neura-abi = { workspace = true }
neura-graph = { workspace = true }
neura-plan = { workspace = true }
neura-runtime = { workspace = true }
neura-nn = { workspace = true }
neura-gpu = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
flate2 = { workspace = true }

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
